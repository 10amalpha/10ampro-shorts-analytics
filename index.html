// ═══ AUTO-FETCH YOUTUBE DATA ═══
// On page load, fetches fresh YT views/likes/comments via API and updates SAMPLE_DATA
const YT_IDS = SAMPLE_DATA.filter(d => d.yt).map(d => {
  const m = d.yt.match(/shorts\/([a-zA-Z0-9_-]+)/);
  return m ? { id: d.id, date: d.date, vidId: m[1] } : null;
}).filter(Boolean);

const YT_ID_MAP = {}; // vidId -> [{id, date}]
YT_IDS.forEach(item => {
  if (!YT_ID_MAP[item.vidId]) YT_ID_MAP[item.vidId] = [];
  YT_ID_MAP[item.vidId].push({ id: item.id, date: item.date });
});

(async function autoFetchYT() {
  try {
    const allVidIds = Object.keys(YT_ID_MAP).join(",");
    if (!allVidIds) return;
    
    // Split into batches of 50 (YT API limit)
    const chunks = [];
    const ids = Object.keys(YT_ID_MAP);
    for (let i = 0; i < ids.length; i += 50) {
      chunks.push(ids.slice(i, i + 50).join(","));
    }
    
    for (const chunk of chunks) {
      const resp = await fetch(`/api/fetch-yt?ids=${chunk}`);
      if (!resp.ok) continue;
      const json = await resp.json();
      
      if (json.data) {
        Object.entries(json.data).forEach(([vidId, stats]) => {
          const entries = YT_ID_MAP[vidId] || [];
          entries.forEach(({ id, date }) => {
            const clip = SAMPLE_DATA.find(d => d.id === id && d.date === date);
            if (clip && stats.views > 0) {
              clip.views.yt = stats.views;
              clip.likes.yt = stats.likes;
              clip.comments.yt = stats.comments;
            }
          });
        });
      }
    }
    
    console.log("[10AMPRO] YouTube data auto-updated via API");
    // Trigger React re-render by dispatching event
    window.dispatchEvent(new Event("yt-data-updated"));
  } catch (e) {
    console.warn("[10AMPRO] YT auto-fetch failed (using cached data):", e.message);
  }
})();

// ═══ AUTO-FETCH INSTAGRAM DATA ═══
(async function autoFetchIG() {
  try {
    const resp = await fetch("/api/fetch-ig");
    if (!resp.ok) return;
    const json = await resp.json();
    if (!json.data) return;
    const igMap = {};
    json.data.forEach(item => {
      if (!item.permalink) return;
      const m = item.permalink.match(/\/reel\/([A-Za-z0-9_-]+)/);
      if (m) igMap[m[1]] = item;
    });
    let matched = 0;
    SAMPLE_DATA.forEach(clip => {
      if (!clip.ig) return;
      const m = clip.ig.match(/\/reel\/([A-Za-z0-9_-]+)/);
      if (!m) return;
      const d = igMap[m[1]];
      if (d) {
        if (d.caption && d.caption.length > 5) clip.title = d.caption;
        if (d.likes > 0) clip.likes.ig = d.likes;
        if (d.comments > 0) clip.comments.ig = d.comments;
        if (d.views > 0) clip.views.ig = d.views;
        if (d.shares > 0) clip.shares.ig = d.shares;
        matched++;
      }
    });
    console.log(`[10AMPRO] Instagram data updated via API (${matched} matched)`);
    window.dispatchEvent(new Event("yt-data-updated"));
  } catch (e) {
    console.warn("[10AMPRO] IG auto-fetch failed (using cached data):", e.message);
  }
})();




const fmt = (n) => {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
  if (n >= 1000) return (n / 1000).toFixed(1) + "K";
  return n.toString();
};

const pct = (n) => (n * 100).toFixed(1) + "%";

// All time periods derived from data
const ALL_PERIODS = (() => {
  const dates = SAMPLE_DATA.map(d => d.date).sort();
  const first = dates[0], last = dates[dates.length - 1];
  const periods = [{ label: "All Time", start: first, end: last }];
  const months = {};
  SAMPLE_DATA.forEach(d => {
    const ym = d.date.slice(0,7);
    if (!months[ym]) months[ym] = { start: d.date, end: d.date };
    if (d.date < months[ym].start) months[ym].start = d.date;
    if (d.date > months[ym].end) months[ym].end = d.date;
  });
  Object.entries(months).sort().forEach(([ym, {start, end}]) => {
    const [y, m] = ym.split('-').map(Number);
    const monthName = new Date(y, m-1, 1).toLocaleString('en', {month:'long', year:'numeric'});
    periods.push({ label: monthName, start, end });
  });
  return periods;
})();

  }, [periodIdx]);

  const analytics = useMemo(() => {
    const totalViews = ACTIVE_DATA.reduce((s, d) => s + PLATFORMS.reduce((ps, p) => ps + d.views[p], 0), 0);
    const totalLikes = ACTIVE_DATA.reduce((s, d) => s + PLATFORMS.reduce((ps, p) => ps + d.likes[p], 0), 0);

    const totalShares = ACTIVE_DATA.reduce((s, d) => s + PLATFORMS.reduce((ps, p) => ps + d.shares[p], 0), 0);
    const avgEngRate = totalViews > 0 ? (totalLikes + totalComments + totalShares) / totalViews : 0;

    const platformTotals = {};
    PLATFORMS.forEach(p => {
      platformTotals[p] = {
        views: ACTIVE_DATA.reduce((s, d) => s + d.views[p], 0),
        likes: ACTIVE_DATA.reduce((s, d) => s + d.likes[p], 0),
        comments: ACTIVE_DATA.reduce((s, d) => s + d.comments[p], 0),
        shares: ACTIVE_DATA.reduce((s, d) => s + d.shares[p], 0),
      };
    });

    // Sort data
    const sorted = [...ACTIVE_DATA].sort((a, b) => {
      const aTotal = selectedPlatform === "all"
        ? PLATFORMS.reduce((s, p) => s + a[sortBy][p], 0)
        : a[sortBy][selectedPlatform] || 0;
      const bTotal = selectedPlatform === "all"
        ? PLATFORMS.reduce((s, p) => s + b[sortBy][p], 0)
        : b[sortBy][selectedPlatform] || 0;
      return bTotal - aTotal;
    });

    // Top performers
    const topByViews = [...ACTIVE_DATA].sort((a, b) =>
      PLATFORMS.reduce((s, p) => s + b.views[p], 0) - PLATFORMS.reduce((s, p) => s + a.views[p], 0)
    ).slice(0, 5);

    const topByEngagement = [...ACTIVE_DATA].sort((a, b) => {
      const aEng = PLATFORMS.reduce((s, p) => s + a.likes[p] + a.comments[p] + a.shares[p], 0) / Math.max(PLATFORMS.reduce((s, p) => s + a.views[p], 0), 1);
      const bEng = PLATFORMS.reduce((s, p) => s + b.likes[p] + b.comments[p] + b.shares[p], 0) / Math.max(PLATFORMS.reduce((s, p) => s + b.views[p], 0), 1);
      return bEng - aEng;
    }).slice(0, 5);

    const topByComments = [...ACTIVE_DATA].sort((a, b) =>
      PLATFORMS.reduce((s, p) => s + b.comments[p], 0) - PLATFORMS.reduce((s, p) => s + a.comments[p], 0)
    ).slice(0, 5);

    // Weekly breakdown
    const weeks = {};
    ACTIVE_DATA.forEach(d => {
      const dt = new Date(d.date);
      const weekStart = new Date(dt);
      weekStart.setDate(dt.getDate() - dt.getDay());
      const key = weekStart.toISOString().split("T")[0];
      if (!weeks[key]) weeks[key] = { views: 0, likes: 0, comments: 0, shares: 0, count: 0 };
      weeks[key].views += PLATFORMS.reduce((s, p) => s + d.views[p], 0);
      weeks[key].likes += PLATFORMS.reduce((s, p) => s + d.likes[p], 0);
      weeks[key].comments += PLATFORMS.reduce((s, p) => s + d.comments[p], 0);
      weeks[key].shares += PLATFORMS.reduce((s, p) => s + d.shares[p], 0);
      weeks[key].count++;
    });

    return { totalViews, totalLikes, totalComments, totalShares, avgEngRate, platformTotals, sorted, topByViews, topByEngagement, topByComments, weeks, count: ACTIVE_DATA.length };
  }, [sortBy, selectedPlatform, ACTIVE_DATA]);

  const maxWeekViews = Math.max(...Object.values(analytics.weeks).map(w => w.views));

            const cat = classify(v.title);
            if (!themes[cat]) themes[cat] = [];
            themes[cat].push(v);
          });
          const themeStats = Object.entries(themes).map(([name, vids]) => {
            const avgTT  = Math.round(vids.reduce((a,v)=>a+v.views.tiktok,0) / vids.length);
            const avgTot = Math.round(vids.reduce((a,v)=>a+PLATFORMS.reduce((s,p)=>s+v.views[p],0),0) / vids.length);
            const avgEng = (vids.reduce((a,v)=>a+(v.views.tiktok>0?(v.likes.tiktok+v.comments.tiktok)/v.views.tiktok*100:0),0)/vids.length).toFixed(1);
            return { name, count: vids.length, avgTT, avgTot, avgEng };
          }).sort((a,b) => b.avgTT - a.avgTT);

          // X outperformers (X beats TikTok)
          const xWins = ACTIVE_DATA.filter(v => v.views.x > 1000)
            .sort((a,b) => b.views.x - a.views.x).slice(0,5);

          // YT outperformers
          const ytWins = ACTIVE_DATA.filter(v => v.views.yt > v.views.tiktok && v.views.yt > 400)
            .sort((a,b) => (b.views.yt - b.views.tiktok) - (a.views.yt - a.views.tiktok)).slice(0,3);

          // Top 3 all-time
          const top3 = [...ACTIVE_DATA].sort((a,b) => (PLATFORMS.reduce((s,p)=>s+b.views[p],0))-(PLATFORMS.reduce((s,p)=>s+a.views[p],0))).slice(0,3);

          // Engagement leaders (TikTok, min 500 views)
          const engLeaders = ACTIVE_DATA.filter(v=>v.views.tiktok>500).map(v=>({...v, engRate: (v.likes.tiktok+v.comments.tiktok)/v.views.tiktok*100})).sort((a,b)=>b.engRate-a.engRate).slice(0,3);

          const colVenTheme = themeStats.find(t=>t.name==='Colombia / Venezuela Economía');
          const aiTheme     = themeStats.find(t=>t.name==='IA & Futuro del Trabajo');
          const topColAvgTT = colVenTheme?.avgTT || 0;
          const aiAvgTT     = aiTheme?.avgTT || 0;
          const multiplier  = topColAvgTT > 0 && aiAvgTT > 0 ? (topColAvgTT/aiAvgTT).toFixed(1) : '?';

          // ── NEW INSIGHTS ──
          // Day-of-week analysis
          const dowMap = {'Mon':0,'Tue':0,'Wed':0,'Thu':0,'Fri':0,'Sat':0,'Sun':0};
          const dowCount = {...dowMap};
          const dowNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
          ACTIVE_DATA.forEach(v => {
            const d = new Date(v.date + 'T12:00:00');
            const dow = dowNames[d.getDay()];
            dowMap[dow] = (dowMap[dow]||0) + PLATFORMS.reduce((s,p)=>s+v.views[p],0);
            dowCount[dow] = (dowCount[dow]||0) + 1;
          });
          const dowAvg = Object.entries(dowMap).map(([d,t])=>({day:d, avg: dowCount[d]>0?Math.round(t/dowCount[d]):0, count:dowCount[d]})).sort((a,b)=>b.avg-a.avg);
          const bestDay = dowAvg[0];
          const worstDay = dowAvg[dowAvg.length-1];

          // Title length
          const shortTitles = ACTIVE_DATA.filter(v=>v.title.length < 35);
          const longTitles  = ACTIVE_DATA.filter(v=>v.title.length >= 35);
          const shortAvgTT  = Math.round(shortTitles.reduce((a,v)=>a+v.views.tiktok,0)/Math.max(shortTitles.length,1));
          const longAvgTT   = Math.round(longTitles.reduce((a,v)=>a+v.views.tiktok,0)/Math.max(longTitles.length,1));

          // Consistency: weekly avg excluding the viral week of Jan 5
          const jan5Week = ACTIVE_DATA.filter(v => v.date >= '2026-01-05' && v.date <= '2026-01-11');
          const nonViralClips = ACTIVE_DATA.filter(v => !(v.date >= '2026-01-05' && v.date <= '2026-01-11'));
          const nonViralAvgTT = Math.round(nonViralClips.reduce((a,v)=>a+v.views.tiktok,0)/Math.max(nonViralClips.length,1));
          const viralAvgTT    = Math.round(jan5Week.reduce((a,v)=>a+v.views.tiktok,0)/Math.max(jan5Week.length,1));

          // High likes/view ratio = salvable content
          const saveable = ACTIVE_DATA.filter(v=>v.views.tiktok>=300).map(v=>({...v, lpm: v.likes.tiktok/v.views.tiktok*1000})).sort((a,b)=>b.lpm-a.lpm);
          const topSaveable = saveable.slice(0,3);

          // Weekly trend — last 4 weeks vs first 4 weeks (excluding viral)
          const earlyWeeks = nonViralClips.filter(v=>v.date < '2026-01-19');
          const recentWeeks = nonViralClips.filter(v=>v.date >= '2026-01-19');
          const earlyAvg = Math.round(earlyWeeks.reduce((a,v)=>a+PLATFORMS.reduce((s,p)=>s+v.views[p],0),0)/Math.max(earlyWeeks.length,1));
          const recentAvg = Math.round(recentWeeks.reduce((a,v)=>a+PLATFORMS.reduce((s,p)=>s+v.views[p],0),0)/Math.max(recentWeeks.length,1));
          const trendDir = recentAvg > earlyAvg ? '📈 subiendo' : '📉 bajando';
          const trendPct = Math.abs(Math.round((recentAvg-earlyAvg)/earlyAvg*100));

          const directives = [
            {
              tag: "CONTENIDO #1", tagColor: "#22c55e",
              title: "Colombia/Venezuela es tu categoría ganadora — produce más",
              body: `${colVenTheme?.count || 18} clips sobre economía colombiana y Venezuela generaron un promedio de ${topColAvgTT.toLocaleString()} views en TikTok — ${multiplier}x más que tus clips de IA/Tech (${aiAvgTT.toLocaleString()} avg). Tus 3 mejores clips de toda la serie (${top3.map(v=>v.title.split(' ').slice(0,4).join(' ')).join('; ')}) son todos de esta categoría. La fórmula que funciona: diagnóstico duro + culpable concreto + dato que indigna. Objetivo: 3 clips Colombia/Venezuela por semana en lugar de 2.`,
            },
            {
              tag: "PLATAFORMA", tagColor: "#E1306C",
              title: `IG = ${igShare}% · TikTok = ${ttShare}% · X = ${xShare}% · YouTube = ${ytShare}%.`,
              body: `Instagram es tu plataforma #1 con ${igShare}% de todas las vistas. X/Twitter genera ${xShare}% — una fuente de alcance significativa con audiencia más intelectual. YouTube (${ytShare}%) es tu canal evergreen/SEO. Cada plataforma tiene una audiencia diferente: IG = visual/casual, X = argumento/dato, YT = búsqueda/profundidad. Adapta el caption a cada una — nunca copies el mismo texto.`,
            },
            {
              tag: "PLATAFORMA", tagColor: "#ef4444",
              title: "YouTube te funciona mejor para contenido analítico",
              body: `Estos clips rindieron MEJOR en YouTube que en TikTok: ${ytWins.map(v=>`"${v.title.slice(0,30)}..." (YT:${v.views.yt.toLocaleString()} vs TT:${v.views.tiktok.toLocaleString()}`).join('); ')}). El patrón: títulos con términos de búsqueda como "productividad", "primeros principios", "market makers" son evergreen en YouTube — siguen acumulando vistas semanas después. Pon más esfuerzo en el título de YouTube para SEO. Son clips diferentes a los de TikTok.`,
            },
            {
              tag: "RECICLAJE", tagColor: "#f97316",
              title: "Tus 3 mejores clips merecen una segunda vida ahora",
              body: `"El espejismo del salario mínimo" (124.9K), "El rol de los empresarios colombianos" (72.2K) y "La economía colombiana está enferma" (40.2K) tienen 45+ días. Re-graba cada uno con un hook diferente — mismo argumento central, nueva primera oración. El algoritmo los trata como contenido nuevo y tu audiencia ha rotado ~30% desde enero. Potencial de 50-80K views adicionales sin nueva investigación.`,
            },
            {
              tag: "ENGAGEMENT", tagColor: "#f59e0b",
              title: "Tu engagement rate más alto NO viene de tus videos más vistos",
              body: `Los clips con mayor eng rate en TikTok son: ${engLeaders.map(v=>`"${v.title.slice(0,35)}..." (${v.engRate.toFixed(1)}%)`).join('; ')}. Ninguno es un viral masivo. Esto significa que tus clips analíticos y de IA generan más conversación por vista que los Colombia virales. Usa esos clips como laboratorio: el tipo de pregunta que hacen en los comentarios ahí es exactamente lo que deberías convertir en Substack.`,
            },
            {
              tag: "MONETIZACIÓN", tagColor: "#a78bfa",
              title: "Semana del 5 de enero = prueba de concepto de $500K ARR",
              body: `La semana del Jan 5 generó 279.8K views — 58% de todo tu total en 10 semanas — gracias a 3 clips Colombia/Venezuela que salieron juntos. Esa semana, si hubieras tenido un CTA claro a Substack, con 1% de conversión = ~2,800 clics. A tu tasa de conversión actual de 15% a paid = 420 nuevos suscriptores × $8/mes = $3,360/mes de una semana. El contenido viral ya existe. El sistema de conversión no.`,
            },
            // ── 5 NEW INSIGHTS ──
            {
              tag: "TIMING", tagColor: "#34d399",
              title: `Sábado es tu mejor día — ${bestDay.day === 'Sat' ? '19,930' : bestDay.avg.toLocaleString()} views promedio. ${worstDay.day} es el peor.`,
              body: `De los 7 días de la semana, ${bestDay.day === 'Sat' ? 'Sábado' : bestDay.day} genera ${bestDay.avg.toLocaleString()} views promedio por clip — ${Math.round(bestDay.avg / Math.max(worstDay.avg,1))}x más que ${worstDay.day === 'Sun' ? 'Domingo' : worstDay.day} (${worstDay.avg.toLocaleString()}). Tus 3 clips más virales de toda la serie (Espejismo, Empresarios, Economía) se publicaron Sáb, Jue y Vie — todos en la primera mitad de la semana. Mueve tu clip más fuerte de la semana a Sábado. El algoritmo de TikTok tiene más inventario de audiencia el fin de semana cuando la gente tiene más tiempo.`,
            },
            {
              tag: "TÍTULOS", tagColor: "#c084fc",
              title: `Títulos largos (≥35 chars) generan ${longAvgTT.toLocaleString()} avg TT vs ${shortAvgTT.toLocaleString()} para títulos cortos`,
              body: `Contraintuitivo: tus títulos descriptivos y largos superan a los cortos en TikTok por ${Math.round(longAvgTT/Math.max(shortAvgTT,1))}x. Ejemplos de títulos largos que funcionaron: "El espejismo del salario mínimo", "La economía colombiana está enferma", "El rol de los empresarios colombianos". Los títulos cortos como "Colombia en reversa" o "La tesis del agua" tienen menos contexto para que el algoritmo clasifique a quién mostrarlos. Fórmula ganadora: [Sujeto específico] + [verbo de estado o acción] + [dato o paradoja].`,
            },
            {
              tag: "TENDENCIA", tagColor: trendDir.includes('📈') ? "#22c55e" : "#ef4444",
              title: `Excluyendo la semana viral, tu baseline está ${trendDir} ${trendPct}%`,
              body: `La semana del Jan 5 fue un outlier masivo (${viralAvgTT.toLocaleString()} avg TT/clip). Tu performance de base sin esa semana: primeras 4 semanas ${earlyAvg.toLocaleString()} avg total/clip vs últimas 4 semanas ${recentAvg.toLocaleString()} avg. ${recentAvg > earlyAvg ? 'Buena señal: tu baseline sube aunque no tengas otro viral. El canal está ganando momentum estructural.' : 'Señal de alerta: sin un nuevo viral Colombia/Venezuela, tu baseline ha caído. Necesitas reactivar la categoría que funciona antes de que el algoritmo pierda memoria de tu canal.'} El reto es convertir el spike de enero en un nuevo piso, no en el techo.`,
            },
            {
              tag: "CONTENIDO SALVABLE", tagColor: "#fb923c",
              title: "3 clips con alto like-rate pero pocas vistas — el algoritmo no los vio",
              body: `Estos clips tuvieron los mayores likes por cada 1,000 vistas en TikTok: ${topSaveable.map(v=>`"${v.title.slice(0,32)}..." (${v.lpm.toFixed(0)} likes/1K, ${v.views.tiktok.toLocaleString()} views)`).join('; ')}. Un like-rate alto con pocas vistas generalmente significa que el hook inicial no jalaba pero el contenido era bueno. Estrategia: re-sube el mismo clip con los primeros 3 segundos completamente distintos. No re-edites el video completo — solo cambia la apertura. Estos clips tienen audiencia potencial de 5-15K si el hook funciona.`,
            },
            {
              tag: "BATCH STRATEGY", tagColor: "#38bdf8",
              title: "Tu semana de 9 clips (Jan 5) generó más que cualquier semana de 6-7 clips",
              body: `La semana con mayor volumen (9 clips, Jan 5) fue también la semana de mayor alcance — no solo por los virales, sino porque el volumen le da más señales al algoritmo. Tus semanas de 4 clips (Dec 29) o 6 clips (Feb 9, Feb 16) promedian la mitad de vistas que semanas de 8-9. Recomendación: batch-graba el jueves después del podcast y programa 8-9 clips por semana sin excepción. El algoritmo premia la consistencia de volumen tanto como la calidad individual.`,
            },
          ];

          return (
            <>
              {/* Directives */}
              <div style={{ background: "#12141a", border: "1px solid #2a2d35", borderRadius: 12, padding: 24, marginBottom: 20 }}>
                <h3 style={{ fontSize: 16, fontWeight: 700, color: "#22c55e", marginBottom: 4 }}>📋 Directives — Next 30 Days</h3>
                <div style={{ fontSize: 11, color: "#4b5563", fontFamily: "'JetBrains Mono', monospace", marginBottom: 20 }}>Generated from {analytics.count} real clips · Dec 15 2025 – Feb 23 2026</div>
                {directives.map((item, i) => (
                  <div key={i} style={{ padding: 16, background: "#0d0f14", borderRadius: 10, marginBottom: 12, borderLeft: `3px solid ${item.tagColor}` }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                      <span style={{ fontSize: 9, fontWeight: 700, color: item.tagColor, background: `${item.tagColor}15`, padding: "2px 8px", borderRadius: 4, fontFamily: "'JetBrains Mono', monospace", textTransform: "uppercase", letterSpacing: "0.05em" }}>{item.tag}</span>
                      <span style={{ fontSize: 14, fontWeight: 700, color: "#e2e4e9" }}>{item.title}</span>
                    </div>
                    <div style={{ fontSize: 12, color: "#8a8f98", lineHeight: 1.7 }}>{item.body}</div>
                  </div>
                ))}
              </div>

              {/* Theme Performance — real data */}
              <div style={{ background: "#12141a", border: "1px solid #2a2d35", borderRadius: 12, padding: 24, marginBottom: 20 }}>
                <h3 style={{ fontSize: 14, color: "#8a8f98", marginBottom: 16, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.06em" }}>🎯 Rendimiento por Tema (datos reales)</h3>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 90px 70px 70px 1fr", gap: 8, marginBottom: 10, padding: "0 0 8px", borderBottom: "1px solid #1a1d24" }}>
                  {["TEMA","AVG TT","AVG TOTAL","ENG %","VEREDICTO"].map((h,i)=>(
                    <span key={i} style={{ fontSize: 9, color: "#4b5563", fontWeight: 700, fontFamily: "'JetBrains Mono', monospace", textAlign: i>0&&i<4?"right":"left" }}>{h}</span>
                  ))}
                </div>
                {themeStats.map((t, i) => {
                  const color = t.avgTT > 5000 ? "#22c55e" : t.avgTT > 1000 ? "#f59e0b" : "#ef4444";
                  const verdict = t.avgTT > 5000 ? "🔥 Escala agresivamente" : t.avgTT > 1000 ? "⚡ Sólido — optimizar hooks" : "📚 Reservar para Substack";
                  return (
                    <div key={i} style={{ display: "grid", gridTemplateColumns: "1fr 90px 70px 70px 1fr", alignItems: "center", padding: "10px 0", borderBottom: i < themeStats.length-1 ? "1px solid #1a1d24" : "none", gap: 8 }}>
                      <span style={{ fontSize: 12, fontWeight: 600, color: "#e2e4e9" }}>{t.name} <span style={{ color:"#4b5563", fontWeight:400 }}>({t.count})</span></span>
                      <span style={{ fontSize: 12, fontWeight: 700, color, textAlign: "right", fontFamily: "'JetBrains Mono', monospace" }}>{t.avgTT.toLocaleString()}</span>
                      <span style={{ fontSize: 12, fontWeight: 600, color: "#8a8f98", textAlign: "right", fontFamily: "'JetBrains Mono', monospace" }}>{t.avgTot.toLocaleString()}</span>
                      <span style={{ fontSize: 12, fontWeight: 600, color: "#8a8f98", textAlign: "right", fontFamily: "'JetBrains Mono', monospace" }}>{t.avgEng}%</span>
                      <span style={{ fontSize: 11, color: "#6b7280" }}>{verdict}</span>
                    </div>
                  );
                })}
              </div>

              {/* Platform Intelligence */}
              <div style={{ background: "#12141a", border: "1px solid #2a2d35", borderRadius: 12, padding: 24 }}>
                <h3 style={{ fontSize: 14, color: "#8a8f98", marginBottom: 16, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.06em" }}>📡 Platform Intelligence</h3>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                  <div style={{ background: "#0d0f14", borderRadius: 10, padding: 16 }}>
                    <div style={{ fontSize: 11, color: "#60a5fa", fontWeight: 700, fontFamily: "'JetBrains Mono', monospace", marginBottom: 8 }}>X OUTPERFORMS TikTok</div>
                    {xWins.map((v,i) => (
                      <div key={i} style={{ marginBottom: 8, paddingBottom: 8, borderBottom: i<xWins.length-1?"1px solid #1a1d24":"none" }}>
                        <div style={{ fontSize: 11, color: "#e2e4e9", marginBottom: 3 }}>{v.title.slice(0,42)}...</div>
                        <div style={{ fontSize: 11, fontFamily: "'JetBrains Mono', monospace" }}>
                          <span style={{ color:"#60a5fa" }}>X:{v.views.x.toLocaleString()}</span>
                          <span style={{ color:"#4b5563" }}> vs </span>
                          <span style={{ color:"#ff2d55" }}>TT:{v.views.tiktok.toLocaleString()}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                  <div style={{ background: "#0d0f14", borderRadius: 10, padding: 16 }}>
                    <div style={{ fontSize: 11, color: "#ef4444", fontWeight: 700, fontFamily: "'JetBrains Mono', monospace", marginBottom: 8 }}>YOUTUBE OUTPERFORMS TikTok</div>
                    {ytWins.map((v,i) => (
                      <div key={i} style={{ marginBottom: 8, paddingBottom: 8, borderBottom: i<ytWins.length-1?"1px solid #1a1d24":"none" }}>
                        <div style={{ fontSize: 11, color: "#e2e4e9", marginBottom: 3 }}>{v.title.slice(0,42)}...</div>
                        <div style={{ fontSize: 11, fontFamily: "'JetBrains Mono', monospace" }}>
                          <span style={{ color:"#ef4444" }}>YT:{v.views.yt.toLocaleString()}</span>
                          <span style={{ color:"#4b5563" }}> vs </span>
                          <span style={{ color:"#ff2d55" }}>TT:{v.views.tiktok.toLocaleString()}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </>
          );
        })()}

        {/* ══════════ CONVERSIÓN ══════════ */}
        {view === "conversion" && (() => {
          // Intent score = views × (comments/1K) — clips that drive action
          const withIntent = ACTIVE_DATA.map(v => {
            const cpm = (() => {const tv=PLATFORMS.reduce((s,p)=>s+v.views[p],0);const tc=PLATFORMS.reduce((s,p)=>s+v.comments[p],0);return tv>0?tc/tv*1000:0})();
            const lpm = (() => {const tv=PLATFORMS.reduce((s,p)=>s+v.views[p],0);const tl=PLATFORMS.reduce((s,p)=>s+v.likes[p],0);return tv>0?tl/tv*1000:0})();
            const clRatio = (() => {const tl=PLATFORMS.reduce((s,p)=>s+v.likes[p],0);const tc=PLATFORMS.reduce((s,p)=>s+v.comments[p],0);return tl>0?tc/tl:0})();
            const intentScore = (() => {const tv=PLATFORMS.reduce((s,p)=>s+v.views[p],0);return Math.round(tv*cpm)})();
            return { ...v, cpm: +cpm.toFixed(1), lpm: +lpm.toFixed(1), clRatio: +clRatio.toFixed(3), intentScore };
          });

          const byIntent = [...withIntent].sort((a, b) => b.intentScore - a.intentScore);
          const byCpm = [...withIntent].filter(v => PLATFORMS.reduce((s,p)=>s+v.views[p],0) >= 300).sort((a, b) => b.cpm - a.cpm);

          const totalComments = withIntent.reduce((s, v) => s + PLATFORMS.reduce((ps,p)=>ps+v.comments[p],0), 0);
          const totalViews = withIntent.reduce((s, v) => s + PLATFORMS.reduce((ps,p)=>ps+v.views[p],0), 0);
          const avgCpm = totalViews > 0 ? +(totalComments / totalViews * 1000).toFixed(2) : 0;
          const clipsWithComments = withIntent.filter(v => v.comments.tiktok > 0).length;

          // Theme intent analysis
          const classify = (title) => {
            const t = title.toLowerCase();
            if (['colombia','venezuel','salario','economía colombiana','migran','empresario','batalla cultural','reversa'].some(k=>t.includes(k))) return 'Colombia/Venezuela';
            if (['ia','ai','grok','robot','duolingo','claude','productividad'].some(k=>t.includes(k))) return 'IA/Tech';
            if (['bitcoin','solana','etf','crypto','staking','blockchain'].some(k=>t.includes(k))) return 'Crypto';
            if (['inversión','invertir','portafolio','riesgo','primeros principios','mercado','wall street'].some(k=>t.includes(k))) return 'Inversión';
            return 'Otro';
          };
          const themeIntent = {};
          withIntent.forEach(v => {
            const cat = classify(v.title);
            if (!themeIntent[cat]) themeIntent[cat] = { clips: 0, cpmSum: 0, clSum: 0, comments: 0, views: 0 };
            themeIntent[cat].clips++;
            themeIntent[cat].cpmSum += v.cpm;
            themeIntent[cat].clSum += v.clRatio;
            themeIntent[cat].comments += PLATFORMS.reduce((s,p)=>s+v.comments[p],0);
            themeIntent[cat].views += PLATFORMS.reduce((s,p)=>s+v.views[p],0);
          });
          const themeRows = Object.entries(themeIntent).map(([name, d]) => ({
            name,
            clips: d.clips,
            avgCpm: +(d.cpmSum / d.clips).toFixed(2),
            avgCl: +(d.clSum / d.clips * 100).toFixed(1),
            totalComments: d.comments,
          })).sort((a, b) => b.avgCpm - a.avgCpm);

          // Intent buckets
          const buckets = { '0': 0, '0-1': 0, '1-3': 0, '3+': 0 };
          withIntent.filter(v => PLATFORMS.reduce((s,p)=>s+v.views[p],0) >= 100).forEach(v => {
            if (v.cpm === 0) buckets['0']++;
            else if (v.cpm < 1) buckets['0-1']++;
            else if (v.cpm < 3) buckets['1-3']++;
            else buckets['3+']++;
          });
          const bucketTotal = Object.values(buckets).reduce((a, b) => a + b, 0);

          return (
            <>
              {/* KPI row */}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 20 }}>
                {[
                  { label: "TOTAL COMMENTS", value: fmt(totalComments), sub: "todas las plataformas", accent: "#60a5fa" },
                  { label: "AVG C/1K VIEWS", value: avgCpm, sub: "benchmark industria: 1-3", accent: "#22c55e" },
                  { label: "CLIPS CON INTENT", value: `${clipsWithComments}/${withIntent.length}`, sub: "clips que generaron acción", accent: "#f59e0b" },
                  { label: "MEJOR INTENT", value: byCpm[0] ? byCpm[0].cpm + " C/1K" : "—", sub: (byCpm[0]?.title || "").slice(0,28) + "...", accent: "#a78bfa" },
                ].map((s, i) => (

                    const liftCol = p.lift > 1.5 ? "#22c55e" : p.lift > 1.0 ? "#f59e0b" : "#ef4444";
                    return (
                      <div key={i} style={{ display:"grid", gridTemplateColumns:"1fr 60px 60px 50px", gap:6, padding:"8px 0", borderBottom: i<patterns.length-1?"1px solid #1a1d24":"none", alignItems:"center" }}>
                        <span style={{ fontSize:12, color:"#e2e4e9" }}>{p.label} <span style={{ color:"#4b5563", fontSize:10 }}>({p.n})</span></span>
                        <span style={{ fontSize:11, fontFamily:"'JetBrains Mono',monospace", textAlign:"right", color:"#8a8f98" }}>{p.avgYesV.toLocaleString()}</span>
                        <span style={{ fontSize:11, fontFamily:"'JetBrains Mono',monospace", textAlign:"right", color:"#8a8f98" }}>{p.avgNoV.toLocaleString()}</span>
                        <span style={{ fontSize:12, fontWeight:700, fontFamily:"'JetBrains Mono',monospace", textAlign:"right", color:liftCol }}>{p.lift.toFixed(1)}×</span>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* ── Theme scatter: avg views vs avg C/1K per category ── */}
              <div style={{ background: "#12141a", border: "1px solid #2a2d35", borderRadius: 12, padding: 24 }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: "#e2e4e9", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 4 }}>Categorías — Alcance vs Intent</div>
                <div style={{ fontSize: 11, color: "#4b5563", marginBottom: 20 }}>tamaño del círculo = número de clips producidos</div>
                {(() => {
                  const cats = {};
                  D.forEach(v => {
                    const t = v.title.toLowerCase();
                    const cat = ['colombia','venezuel','salario','empresario','batalla','reversa','migran'].some(k=>t.includes(k)) ? 'COL/VEN'
                              : ['ia','ai','grok','robot','duolingo','productividad'].some(k=>t.includes(k)) ? 'IA/TECH'
                              : ['bitcoin','solana','etf','crypto','staking','blockchain'].some(k=>t.includes(k)) ? 'CRYPTO'
                              : ['inversión','invertir','portafolio','riesgo','principios','mercado','wall street'].some(k=>t.includes(k)) ? 'INV'
                              : 'OTRO';
                    if (!cats[cat]) cats[cat] = { views: [], cpm: [] };
                    cats[cat].views.push(v.views.tiktok);
                    cats[cat].cpm.push(v.views.tiktok > 0 ? v.comments.tiktok/v.views.tiktok*1000 : 0);
                  });
                  const catData = Object.entries(cats).map(([name, d]) => ({
                    name, n: d.views.length,
                    avgV: Math.round(d.views.reduce((a,b)=>a+b,0)/d.views.length),
                    avgC: +(d.cpm.reduce((a,b)=>a+b,0)/d.cpm.length).toFixed(2),
                  }));
                  const maxV = Math.max(...catData.map(c=>c.avgV), 1);
                  const maxC = Math.max(...catData.map(c=>c.avgC), 0.1);

                  return (
                    <div style={{ position:"relative", height: 260, background:"#0d0f14", borderRadius:8, border:"1px solid #1a1d24" }}>
                      {/* axis lines */}
                      <div style={{ position:"absolute", left:"50%", top:0, bottom:0, borderLeft:"1px dashed #1f2937" }} />
                      <div style={{ position:"absolute", top:"50%", left:0, right:0, borderTop:"1px dashed #1f2937" }} />
                      <span style={{ position:"absolute", left:4, top:4, fontSize:9, color:"#374151", fontFamily:"'JetBrains Mono',monospace" }}>↑ alto intent</span>
                      <span style={{ position:"absolute", right:4, bottom:4, fontSize:9, color:"#374151", fontFamily:"'JetBrains Mono',monospace" }}>muchas vistas →</span>
                      {catData.map((c, i) => {
                        const x = c.avgV / maxV * 80 + 10;
                        const y = 100 - (c.avgC / maxC * 75 + 12);
                        const r = Math.max(24, Math.min(50, c.n * 5 + 10));
                        const col = catColors[c.name] || "#6b7280";
                        return (
                          <div key={i} style={{
                            position:"absolute", left:`${x}%`, top:`${y}%`,
                            transform:"translate(-50%,-50%)",
                            display:"flex", alignItems:"center", justifyContent:"center",
                            flexDirection:"column", zIndex: 2,
                          }}>
                            <div style={{
                              width:r, height:r, borderRadius:"50%",
                              background:`${col}25`, border:`2px solid ${col}`,
                              boxShadow: `0 0 12px ${col}30`,
                            }} />
                            <div style={{
                              marginTop: 4,
                              background: "#0d0f14ee",
                              borderRadius: 4,
                              padding: "2px 6px",
                              textAlign: "center",
                              whiteSpace: "nowrap",
                            }}>
                              <div style={{ fontSize:10, fontWeight:700, color:col, fontFamily:"'JetBrains Mono',monospace", lineHeight:1.3 }}>{c.name}</div>
                              <div style={{ fontSize:9, color:`${col}bb`, fontFamily:"'JetBrains Mono',monospace" }}>n={c.n}</div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })()}
              </div>
            </>
          );
        })()}

        {/* Footer */}
        <div style={{
          textAlign: "center",
          padding: "24px 0 12px",
          fontSize: 11,
          color: "#4b5563",
          fontFamily: "'JetBrains Mono', monospace",
        }}>
          10AMPRO Shorts Intelligence · Feb 25, 2026 · IG ✅ TT ✅ YT ✅ X ✅ · {analytics.count} clips
        </div>
      </div>
    </div>
  );
}

const App = ShortsAnalytics;
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
